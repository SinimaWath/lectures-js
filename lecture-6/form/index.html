<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="root">
      <div class="product-form">
        <form
          name="product-from"
          action="api/form"
          method="POST"
          enctype="multipart/form-data"
          class="form-grid"
        >
          <div class="form-group form-group__half_left">
            <label class="form-label">
              Названия товара
              <input
                type="text"
                name="title"
                class="form-control"
                placeholder="Iphone"
                list="product-titles"
              />
            </label>
            <datalist id="product-titles"> </datalist>
          </div>
          <div class="form-group form-group__wide">
            <label class="form-label" for="description">Описание</label>
            <textarea
              id="description"
              class="form-control"
              name="description"
              data-element="productDescription"
              placeholder="Описание товара"
            ></textarea>
          </div>
          <div class="form-group form-group__half_left">
            <label class="form-label" for="subcategory">Категория</label>
            <select class="form-control" id="subcategory" name="subcategory">
              <option value="tovary-dlya-kuxni">
                Бытовая техника &gt; Товары для кухни
              </option>
              <option value="tovary-dlya-doma">
                Бытовая техника &gt; Товары для дома
              </option>
              <option value="krasota-i-zdorove">
                Бытовая техника &gt; Красота и здоровье
              </option>
              <option value="smartfony-i-gadzhety">
                Смартфоны &gt; Смартфоны и гаджеты
              </option>
              <option value="fototexnika">Смартфоны &gt; Фототехника</option>
              <option value="planshety-elektronnye-knigi">
                Смартфоны &gt; Планшеты, электронные книги
              </option>
            </select>
          </div>

          <fieldset
            class="form-group form-group__half_left form-group__two-col"
          >
            <label class="form-label"
              >Цена ($)
              <input
                id="price"
                value=""
                type="number"
                name="price"
                class="form-control"
                placeholder="100"
              />
            </label>
            <label class="form-label"
              >Скидка ($)
              <input
                id="discount"
                value=""
                type="number"
                name="discount"
                class="form-control"
                placeholder="0"
              />
            </label>
          </fieldset>

          <div class="form-group form-group__half_left">
            <label class="form-label"
              >Условия
              <input type="checkbox" name="conditions" required />
              <!-- <div></div> -->
            </label>
          </div>

          <div class="form-buttons">
            <button type="submit" class="button-primary-outline">
              Добавить товар
            </button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
