<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vanilla SPA Router</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div class="app">
      <!-- Заранее отрисованный Header (SSR) -->
      <header class="topbar">
        <div class="logo">Vanilla SPA</div>
        <nav class="nav">
          <a href="/" data-nav-link>Home</a>
          <a href="/products" data-nav-link>Products</a>
          <a href="/categories" data-nav-link>Categories</a>
          <a href="/about" data-nav-link>About</a>
        </nav>
        <div class="actions">
          <button type="button" data-action="back">Back</button>
          <button type="button" data-action="forward">Forward</button>
        </div>
      </header>

      <!-- Динамический контет (CSR) -->
      <main id="content" class="content">
        <div class="page page--loading">Loading...</div>
      </main>
    </div>
  </body>
</html>
